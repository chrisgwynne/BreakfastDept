# journal-feed block — latest or curated journal articles.
# fields: heading, articles, count
name: Journal feed
icon: text
fields:
  heading:
    label: Heading
    type: text
  articles:
    label: Articles
    type: pages
    query: site.index.filterBy("intendedTemplate", "article")
    help: Leave empty to show the most recent articles automatically.
  count:
    label: Number to show (if automatic)
    type: number
    default: 3
    min: 1
    max: 12
