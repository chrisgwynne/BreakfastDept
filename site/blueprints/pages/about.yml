##
# About page — studio story, the person behind it, principles, fit.
##
title: About
icon: users
preview: true
status:
  draft: false
  listed: true
options:
  delete: false

tabs:
  content:
    label: Content
    icon: text
    fields:
      title:
        label: Title
        type: text
        required: true
        maxlength: 70
        counter: true
      intro:
        label: Intro
        type: blocks
        extends: fields/bodyblocks

      founderheadline:
        type: headline
        label: The person behind Breakfast
      founder_name:
        label: Name
        type: text
        width: 1/2
      founder_role:
        label: Role
        type: text
        width: 1/2
      founder_bio:
        label: Short bio
        type: textarea
        buttons: false
      founder_caption:
        label: Photo caption (handwritten style)
        type: text
        help: Shown under the polaroid photo.
      founder_photo:
        label: Photo (polaroid)
        type: files
        max: 1
        query: page.images
        uploads: images
        help: A friendly portrait works best. Leave empty to show a placeholder.

      howheadline:
        type: headline
        label: How Breakfast works
      how_heading:
        label: Heading
        type: text
      how_text:
        label: Text
        type: textarea
        buttons: false

      principlesheadline:
        type: headline
        label: Principles
      principles:
        label: Principles
        type: structure
        fields:
          title:
            label: Title
            type: text
          text:
            label: Text
            type: textarea
            buttons: false

      fitheadline:
        type: headline
        label: Who Breakfast is for
      client_fit:
        label: A good fit
        type: structure
        fields:
          text:
            label: Text
            type: text
      not_a_fit:
        label: Probably not a fit
        type: structure
        fields:
          text:
            label: Text
            type: text

      metaheadline:
        type: headline
        label: Details
      location:
        label: Location
        type: text
        width: 1/2
      tools:
        label: Tools
        type: tags
        width: 1/2

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
