##
# Contact page — intro + editable contact form strings.
##
title: Contact
icon: email
preview: true
status:
  draft: false
  listed: true
options:
  delete: false

tabs:
  content:
    label: Content
    icon: text
    fields:
      title:
        label: Title
        type: text
        required: true
        maxlength: 70
        counter: true
      intro:
        label: Intro
        type: blocks
        extends: fields/bodyblocks

  form:
    label: Form copy
    icon: edit
    fields:
      form:
        extends: fields/contactform

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
