##
# Project — a case study. Ordered by date (newest first).
##
title: Project
icon: image
num: date
preview: true

tabs:
  content:
    label: Content
    icon: text
    fields:
      title:
        label: Project title
        type: text
        required: true
        maxlength: 80
        counter: true
      project_status:
        label: Project status
        type: select
        required: true
        default: concept
        width: 1/2
        help: Rendered honestly on the public page. Only "Real client work" is presented as a client with a name and testimonial.
        options:
          real: Real client work
          concept: Concept project
          internal: Internal project
          draft: Draft (unpublished)
      client:
        label: Client / subject
        type: text
        width: 1/2
        help: For concept work, describe the business type (e.g. "Italian restaurant") — not a real client name.
      summary:
        label: Summary
        type: textarea
        buttons: false
        maxlength: 300
        counter: true
        help: Short overview used on cards and as an SEO fallback.
      challenge:
        label: Challenge
        type: textarea
        buttons: false
      approach:
        label: Approach
        type: textarea
        buttons: false
      strategy:
        label: Strategy
        type: textarea
        buttons: false
      design_explanation:
        label: Design
        type: textarea
        buttons: false
      build_explanation:
        label: Build
        type: textarea
        buttons: false
      outcome:
        label: Outcome
        type: textarea
        buttons: false
      metricsheadline:
        type: headline
        label: Metrics
      metrics:
        label: Metrics
        type: structure
        fields:
          value:
            label: Value
            type: text
            width: 1/4
          label:
            label: Label
            type: text
            width: 1/4
          context:
            label: Context
            type: text
            width: 1/4
          note:
            label: Note
            type: text
            width: 1/4
      testimonialheadline:
        type: headline
        label: Testimonial
      testimonial_quote:
        label: Quote
        type: textarea
        buttons: false
      testimonial_name:
        label: Name
        type: text
        width: 1/2
      testimonial_role:
        label: Role
        type: text
        width: 1/2
      creditsheadline:
        type: headline
        label: Credits
      credits:
        label: Credits
        type: structure
        fields:
          role:
            label: Role
            type: text
            width: 1/2
          name:
            label: Name
            type: text
            width: 1/2
      bodyheadline:
        type: headline
        label: Additional sections
      body:
        label: Body
        type: blocks
        extends: fields/bodyblocks

  media:
    label: Media
    icon: image
    fields:
      hero_image:
        label: Hero image
        type: files
        max: 1
        query: page.images
        uploads: images
      card_image:
        label: Card image
        type: files
        max: 1
        query: page.images
        uploads: images
        help: Thumbnail used in grids. Falls back to the hero image.
      gallery:
        label: Gallery
        type: files
        query: page.images
        uploads: images
      before_image:
        label: Before image
        type: files
        max: 1
        query: page.images
        uploads: images
        width: 1/2
      after_image:
        label: After image
        type: files
        max: 1
        query: page.images
        uploads: images
        width: 1/2

  relationships:
    label: Relationships
    icon: merge
    fields:
      services:
        label: Services
        type: pages
        query: site.index.filterBy("intendedTemplate", "service")
      industries:
        label: Industries
        type: tags
      technology:
        label: Technology
        type: tags
      related_projects:
        label: Related projects
        type: pages
        query: site.index.filterBy("intendedTemplate", "project")
      related_services:
        label: Related services
        type: pages
        query: site.index.filterBy("intendedTemplate", "service")
      project_url:
        label: Live project URL
        type: url

  settings:
    label: Settings
    icon: settings
    fields:
      date:
        label: Date
        type: date
        default: today
        required: true
      featured:
        label: Featured
        type: toggle
        default: false
        width: 1/3
      confidential:
        label: Confidential
        type: toggle
        default: false
        width: 1/3
        help: Hide the client name / limit detail on the public page.

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
