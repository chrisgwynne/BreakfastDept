##
# Project — a case study. Ordered by date (newest first).
##
title: Project
icon: image
num: date
preview: true

tabs:
  content:
    label: Content
    icon: text
    fields:
      title:
        label: Project title
        type: text
        required: true
        maxlength: 80
        counter: true
      project_status:
        label: Project status
        type: select
        required: true
        default: concept
        width: 1/2
        help: Rendered honestly on the public page. Only "Real client work" is presented as a client with a name and testimonial.
        options:
          real: Real client work
          concept: Concept project
          internal: Internal project
          draft: Draft (unpublished)
      client:
        label: Client / subject
        type: text
        width: 1/2
        help: For concept work, describe the business type (e.g. "Italian restaurant") — not a real client name.
      summary:
        label: Summary
        type: textarea
        buttons: false
        maxlength: 300
        counter: true
        help: Short overview used on cards and as an SEO fallback.
      challenge:
        label: Challenge
        type: textarea
        buttons: false
      approach:
        label: Approach
        type: textarea
        buttons: false
      strategy:
        label: Strategy
        type: textarea
        buttons: false
      design_explanation:
        label: Design
        type: textarea
        buttons: false
      build_explanation:
        label: Build
        type: textarea
        buttons: false
      outcome:
        label: Outcome
        type: textarea
        buttons: false
      metricsheadline:
        type: headline
        label: Metrics
      metrics:
        label: Metrics
        type: structure
        fields:
          value:
            label: Value
            type: text
            width: 1/4
          label:
            label: Label
            type: text
            width: 1/4
          context:
            label: Context
            type: text
            width: 1/4
          note:
            label: Note
            type: text
            width: 1/4
      testimonialheadline:
        type: headline
        label: Testimonial
      testimonial_quote:
        label: Quote
        type: textarea
        buttons: false
      testimonial_name:
        label: Name
        type: text
        width: 1/2
      testimonial_role:
        label: Role
        type: text
        width: 1/2
      creditsheadline:
        type: headline
        label: Credits
      credits:
        label: Credits
        type: structure
        fields:
          role:
            label: Role
            type: text
            width: 1/2
          name:
            label: Name
            type: text
            width: 1/2
      bodyheadline:
        type: headline
        label: Additional sections
      body:
        label: Body
        type: blocks
        extends: fields/caseblocks
        help: Compose the case study. Mix art-directed layouts, editorial beats and brand moments — no two projects need the same order.

  artdirection:
    label: Art direction
    icon: palette
    fields:
      ad_intro:
        type: info
        label: Make this case study feel bespoke
        text: >
          Every setting here is a curated, tested option — never raw CSS. Start
          from a preset, then refine. The public page stays recognisably
          Breakfast (nav, footer, type, focus states, accessibility) while the
          art direction gives this project its own visual personality.
      ad_preset:
        label: Preset
        type: select
        width: 1/2
        default: bold-editorial
        help: A coherent starting look. Settings below override it where set.
        options:
          bold-editorial: Bold Editorial
          playful-collage: Playful Collage
          quiet-premium: Quiet Premium
          image-first: Image First
          device-showcase: Device Showcase
          before-after: Before & After
          typography-led: Typography Led
          colour-led: Colour Led
          story-driven: Story Driven
      ad_hero:
        label: Hero composition
        type: select
        width: 1/2
        help: Preview each before choosing — no hero is applied globally.
        options:
          cinematic: Cinematic (full-bleed)
          layered-devices: Layered devices
          editorial: Editorial (big type)
          collage: Collage (playful)
          minimal: Minimal impact
          split: Split-screen
      ad_paletteheadline:
        type: headline
        label: Palette
      ad_accent:
        label: Accent colour
        type: select
        width: 1/4
        options: &adcolours
          ink: Ink
          cream: Cream
          paper: Paper
          white: White
          yellow: Yellow
          butter: Butter
          purple: Purple
          plum: Plum
          coral: Coral
          blush: Blush
          sage: Sage
          forest: Forest
          midnight: Midnight
          sky: Sky
          terracotta: Terracotta
          sand: Sand
          mint: Mint
          charcoal: Charcoal
      ad_secondary:
        label: Secondary colour
        type: select
        width: 1/4
        options: *adcolours
      ad_bg:
        label: Background
        type: select
        width: 1/4
        options: *adcolours
      ad_text:
        label: Text colour
        type: select
        width: 1/4
        options: *adcolours
      ad_typeheadline:
        type: headline
        label: Type & form
      ad_display:
        label: Display type
        type: select
        width: 1/3
        options:
          grotesk-tight: Grotesk (tight)
          grotesk-wide: Grotesk (wide)
          mono-caps: Mono caps
      ad_body:
        label: Body type
        type: select
        width: 1/3
        options:
          sans: Sans
          mono: Mono
      ad_density:
        label: Section density
        type: select
        width: 1/3
        options:
          airy: Airy
          balanced: Balanced
          tight: Tight
      ad_corner:
        label: Image corners
        type: select
        width: 1/3
        options:
          sharp: Sharp
          soft: Soft
          round: Round
          pill: Pill
      ad_border:
        label: Border treatment
        type: select
        width: 1/3
        options:
          none: None
          thin: Thin
          thick: Thick
          heavy: Heavy
      ad_image_scale:
        label: Image scale
        type: select
        width: 1/3
        options:
          contained: Contained
          bleed: Bleed
          oversized: Oversized
      ad_rotation:
        label: Rotation intensity
        type: select
        width: 1/3
        help: Bounded so content never becomes unreadable; reduced on mobile.
        options:
          none: None (0°)
          subtle: Subtle (3°)
          playful: Playful (6°)
          wild: Wild (8°)
      ad_caption:
        label: Caption style
        type: select
        width: 1/3
        options:
          quiet: Quiet
          mono-tag: Mono tag
          handwritten: Handwritten
          boxed: Boxed
      ad_pullquote:
        label: Pull-quote style
        type: select
        width: 1/3
        options:
          plain: Plain
          giant: Giant
          marks: Giant marks
          panel: Colour panel
          rotated: Rotated card
          over-image: Over image
      ad_motionheadline:
        type: headline
        label: Motion & transitions
      ad_animation:
        label: Animation character
        type: select
        width: 1/3
        help: One coherent behaviour per page. Always respects reduced-motion.
        options:
          quiet: Quiet editorial
          playful-stagger: Playful stagger
          mask-reveal: Bold mask reveals
          parallax-lite: Layered parallax
          fade: Minimal fade
          device-assembly: Device assembly
          none: None
      ad_transition:
        label: Section transitions
        type: select
        width: 1/3
        options:
          hard-cut: Hard colour cut
          slide-panel: Sliding panel
          angled: Angled divider
          oversized-rule: Oversized rule
          overlap: Overlap
          whitespace: Whitespace reset
      ad_motif:
        label: Decorative motif
        type: select
        width: 1/3
        options:
          none: None
          dots: Dots
          grid: Grid
          wave: Wave
          star: Star
          arrow: Arrow
          underline: Underline
          sticker: Sticker
      ad_ending:
        label: Ending composition
        type: select
        width: 1/2
        help: Vary the close — not every case study should end the same way.
        options:
          giant-shot: Giant final screenshot
          testimonial: Testimonial takeover
          results: Results panel
          visit: Visit-the-site moment
          lessons: Project lessons
          next-teaser: Next-project teaser
          motif: Brand motif
          mobile-row: Mobile-device row

  media:
    label: Media
    icon: image
    fields:
      hero_image:
        label: Hero image
        type: files
        max: 1
        query: page.images
        uploads: images
      card_image:
        label: Card image
        type: files
        max: 1
        query: page.images
        uploads: images
        help: Thumbnail used in grids. Falls back to the hero image.
      gallery:
        label: Gallery
        type: files
        query: page.images
        uploads: images
      before_image:
        label: Before image
        type: files
        max: 1
        query: page.images
        uploads: images
        width: 1/2
      after_image:
        label: After image
        type: files
        max: 1
        query: page.images
        uploads: images
        width: 1/2

  relationships:
    label: Relationships
    icon: merge
    fields:
      services:
        label: Services
        type: pages
        query: site.index.filterBy("intendedTemplate", "service")
      industries:
        label: Industries
        type: tags
      technology:
        label: Technology
        type: tags
      related_projects:
        label: Related projects
        type: pages
        query: site.index.filterBy("intendedTemplate", "project")
      related_services:
        label: Related services
        type: pages
        query: site.index.filterBy("intendedTemplate", "service")
      project_url:
        label: Live project URL
        type: url
      approved_hosts:
        label: Approved capture hosts
        type: text
        help: Comma-separated hosts the screenshot tool may capture (e.g. acme.com, www.acme.com). Falls back to the live URL's host.
      approved_paths:
        label: Approved capture paths
        type: text
        help: Optional comma-separated paths offered in the capture tool (e.g. /, /about, /contact).

  settings:
    label: Settings
    icon: settings
    fields:
      date:
        label: Date
        type: date
        default: today
        required: true
      featured:
        label: Featured
        type: toggle
        default: false
        width: 1/3
      confidential:
        label: Confidential
        type: toggle
        default: false
        width: 1/3
        help: Hide the client name / limit detail on the public page.

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
