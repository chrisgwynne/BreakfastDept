##
# Home page — a fixed set of individually toggleable sections.
# Each section has an enable toggle; its fields only show when enabled.
# Rebuilt for the conversion-focused redesign: hero → services →
# why → diagnostic → process → client platform → journal → CTA.
##
title: Home
icon: home
status:
  draft: false
  listed: true
preview: true
options:
  changeStatus: false
  delete: false

tabs:
  content:
    label: Content
    icon: text
    columns:
      - width: 2/3
        sections:
          sectionfields:
            type: fields
            fields:
              # ---------------------------------------------------------- Hero
              hero_headline_group:
                type: headline
                label: Hero
              hero_eyebrow:
                label: Eyebrow
                type: text
              hero_headline:
                label: Headline
                type: text
              hero_highlight:
                label: Highlighted ending
                type: text
                help: The closing fragment of the headline, shown in a yellow box.
              hero_text:
                label: Intro text
                type: textarea
                buttons: false
                maxlength: 200
                help: Keep to two or three short lines.
              hero_availability:
                label: Availability note
                type: text
              hero_primary_label:
                label: Primary button label
                type: text
                width: 1/2
              hero_primary_link:
                label: Primary button link
                type: link
                width: 1/2
              hero_secondary_label:
                label: Secondary button label
                type: text
                width: 1/2
              hero_secondary_link:
                label: Secondary button link
                type: link
                width: 1/2
              hero_aside_label:
                label: Low-commitment link label
                type: text
                width: 1/2
              hero_aside_link:
                label: Low-commitment link
                type: link
                width: 1/2
              hero_image:
                label: Hero image (optional — replaces the built-in graphic)
                type: files
                max: 1
                query: page.images
                uploads: images

              # ------------------------------------------------------- Services
              services_headline_group:
                type: headline
                label: Services
              services_enabled:
                label: Show services
                type: toggle
                default: true
              services_heading:
                label: Heading
                type: text
                when:
                  services_enabled: true
              services_intro:
                label: Intro
                type: textarea
                buttons: false
                when:
                  services_enabled: true
              services_cards:
                label: Service cards (keep to three)
                type: structure
                max: 3
                when:
                  services_enabled: true
                fields:
                  title:
                    label: Title
                    type: text
                  text:
                    label: One-line summary
                    type: text
                  audience:
                    label: Ideal client
                    type: text
                  link:
                    label: Link
                    type: link

              # ---------------------------------------------------- Why Breakfast
              why_headline_group:
                type: headline
                label: Why Breakfast
              why_enabled:
                label: Show differentiators
                type: toggle
                default: true
              why_heading:
                label: Heading
                type: text
                when:
                  why_enabled: true
              why_points:
                label: Principles (keep to three)
                type: structure
                max: 3
                when:
                  why_enabled: true
                fields:
                  title:
                    label: Title
                    type: text
                  text:
                    label: One short sentence
                    type: text

              # ----------------------------------------------------- Diagnostic
              diagnostic_headline_group:
                type: headline
                label: Website diagnostic
              diagnostic_enabled:
                label: Show diagnostic
                type: toggle
                default: true
              diagnostic_heading:
                label: Heading
                type: text
                when:
                  diagnostic_enabled: true
              diagnostic_intro:
                label: Intro
                type: text
                when:
                  diagnostic_enabled: true
              diagnostic_checks:
                label: Checks (four works best)
                type: structure
                max: 4
                when:
                  diagnostic_enabled: true
                fields:
                  question:
                    label: Question
                    type: text
                  detail:
                    label: Detail
                    type: text

              # -------------------------------------------------------- Process
              process_headline_group:
                type: headline
                label: Process
              process_enabled:
                label: Show process
                type: toggle
                default: true
              process_heading:
                label: Heading
                type: text
                when:
                  process_enabled: true
              process_steps:
                label: Steps (four works best)
                type: structure
                max: 4
                when:
                  process_enabled: true
                fields:
                  title:
                    label: Title
                    type: text
                  text:
                    label: One short sentence
                    type: text

              # ------------------------------------------------ Client platform
              platform_headline_group:
                type: headline
                label: Client platform
              platform_enabled:
                label: Show client platform
                type: toggle
                default: true
              platform_heading:
                label: Heading
                type: text
                when:
                  platform_enabled: true
              platform_text:
                label: Text
                type: textarea
                buttons: false
                when:
                  platform_enabled: true
              platform_points:
                label: Benefits
                type: structure
                when:
                  platform_enabled: true
                fields:
                  text:
                    label: Benefit
                    type: text

              # -------------------------------------------------------- Journal
              journal_headline_group:
                type: headline
                label: Journal
              journal_enabled:
                label: Show journal
                type: toggle
                default: true
              journal_heading:
                label: Heading
                type: text
                when:
                  journal_enabled: true
              journal_count:
                label: Number of articles
                type: number
                default: 3
                min: 1
                max: 6
                when:
                  journal_enabled: true

              # ------------------------------------------------------ Final CTA
              final_cta_headline_group:
                type: headline
                label: Final CTA
              final_cta_enabled:
                label: Show final CTA
                type: toggle
                default: true
              final_cta_heading:
                label: Heading (overrides site CTA)
                type: text
                when:
                  final_cta_enabled: true
              final_cta_text:
                label: Text (overrides site CTA)
                type: textarea
                buttons: false
                when:
                  final_cta_enabled: true

      - width: 1/3
        sections:
          media:
            label: Images
            type: files
            template: image
            layout: cards

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
