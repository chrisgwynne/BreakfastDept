        type: blocks
        extends: fields/bodyblocks
      back_label:
        label: Back link label
        type: text
        width: 1/2
        default: Back to home
      back_link:
        label: Back link
        type: link
        width: 1/2

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo_note:
        type: info
        label: Search visibility
        text: This page should be hidden from search engines. Set "Hide from search engines" below.
      seo:
        extends: fields/seogroup
