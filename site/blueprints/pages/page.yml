##
# Generic curated page — free-form page builder using the `body` blocks field
# restricted to the approved block set.
##
title: Page
icon: page
preview: true

tabs:
  content:
    label: Content
    icon: text
    columns:
      - width: 2/3
        fields:
          title:
            label: Title
            type: text
            required: true
            maxlength: 70
            counter: true
          body:
            label: Body
            type: blocks
            extends: fields/bodyblocks
      - width: 1/3
        sections:
          media:
            label: Images
            type: files
            template: image
            layout: cards

  seo:
    label: SEO & sharing
    icon: search
    fields:
      seo:
        extends: fields/seogroup
