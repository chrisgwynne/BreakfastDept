##
# Global site settings for the Breakfast studio website.
# Field names follow docs/content-model.md exactly.
##
title: Breakfast
tabs:
  general:
    label: General
    icon: home
    fields:
      title:
        label: Studio name
        type: text
        required: true
      legal_name:
        label: Legal name
        type: text
        help: Registered/legal entity name. Used in structured data and the footer.
      tagline:
        label: Tagline
        type: text
        help: Short strapline shown in the header / meta.
      availability_text:
        label: Availability text
        type: text
        help: 'Only shown when "Show availability line" (Business & location tab) is on. Keep it true — no invented scarcity.'

  business:
    label: Business & location
    icon: home
    fields:
      whoheadline:
        type: headline
        label: Who & where
      owner_name:
        label: Owner / display name
        type: text
        width: 1/2
        help: The person behind Breakfast. Used on the About page and in structured data. Leave blank to stay anonymous — never invented.
      voice:
        label: Voice
        type: select
        width: 1/2
        default: singular
        help: How copy refers to the business. Must match the real structure — do not imply staff who don't exist.
        options:
          singular: Singular — I / me (one person)
          company: Neutral — "Breakfast"
          plural: Plural — we / us (a real team)
      base_town:
        label: Base town or city
        type: text
        width: 1/3
        help: Leave blank until confirmed. The site says "Wales" until a real town is entered — never guess one.
      county:
        label: County / region
        type: text
        width: 1/3
        help: e.g. Conwy, North Wales. Optional.
      country:
        label: Country
        type: text
        width: 1/3
        default: Wales
      geo_wording:
        label: Preferred geographic wording
        type: text
        help: 'Optional override for the automatic phrasing, e.g. "Based in Wales, working across the UK".'
      areas_served:
        label: Areas served
        type: tags
        help: Towns/regions you work with, for local context and structured data. Optional.
      service_radius:
        label: Service radius
        type: text
        width: 1/2
        help: 'e.g. "North Wales and beyond". Optional.'
      remote_wording:
        label: Remote-work wording
        type: text
        width: 1/2
        help: 'How you describe working further afield, e.g. "Happy to work remotely across the UK". Optional.'
      hoursheadline:
        type: headline
        label: Hours & profile
      business_hours:
        label: Business hours
        type: structure
        help: Optional. Shown on Contact and used in structured data when set.
        fields:
          days:
            label: Days
            type: text
            width: 1/2
            placeholder: e.g. Mon–Fri
          hours:
            label: Hours
            type: text
            width: 1/2
            placeholder: e.g. 9am–5pm
      google_business_url:
        label: Google Business Profile URL
        type: url
      geoheadline:
        type: headline
        label: Map coordinates (optional)
      latitude:
        label: Latitude
        type: number
        width: 1/2
        step: 0.000001
      longitude:
        label: Longitude
        type: number
        width: 1/2
        step: 0.000001
      availabilityheadline:
        type: headline
        label: Availability
      availability_enabled:
        label: Show availability line
        type: toggle
        default: false
        help: Off by default. Turn on only when the availability text is genuinely true right now.

  contact:
    label: Contact
    icon: email
    fields:
      email:
        label: Main email
        type: email
        width: 1/2
      enquiry_email:
        label: Enquiry email
        type: email
        width: 1/2
        help: Where enquiries are delivered. Mirrors MAIL_ENQUIRIES_TO.
      phone:
        label: Phone
        type: tel
        width: 1/2
      address:
        label: Postal address
        type: textarea
        buttons: false
      socialheadline:
        type: headline
        label: Social profiles
      social:
        label: Social links
        type: structure
        fields:
          platform:
            label: Platform
            type: text
            width: 1/2
          url:
            label: URL
            type: url
            width: 1/2

  navigation:
    label: Navigation
    icon: menu
    fields:
      nav:
        label: Primary navigation
        type: structure
        fields:
          label:
            label: Label
            type: text
            width: 1/2
          link:
            label: Link
            type: link
            width: 1/2
      footernavheadline:
        type: headline
        label: Footer
      footer_nav:
        label: Footer navigation
        type: structure
        fields:
          label:
            label: Label
            type: text
            width: 1/2
          link:
            label: Link
            type: link
            width: 1/2
      footer_copy:
        label: Footer sign-off copy
        type: textarea
        buttons: false

  cta:
    label: CTA
    icon: bolt
    fields:
      cta_heading:
        label: CTA heading
        type: text
      cta_text:
        label: CTA body
        type: textarea
        buttons: false
      cta_primary_label:
        label: Primary button label
        type: text
        width: 1/2
      cta_primary_link:
        label: Primary button link
        type: text
        width: 1/2
      cta_secondary_label:
        label: Secondary button label
        type: text
        width: 1/2
      cta_secondary_link:
        label: Secondary button link
        type: text
        width: 1/2

  seo:
    label: SEO defaults
    icon: search
    fields:
      meta_description:
        label: Default meta description
        type: textarea
        maxlength: 160
        counter: true
        buttons: false
        help: Used when a page has no meta description of its own.
      default_social_image:
        label: Default social image
        type: files
        max: 1
        query: site.images
        uploads: images
        help: Default Open Graph image. Ideal 1200×630.

  analytics:
    label: Analytics & cookies
    icon: chart
    fields:
      analytics_provider:
        label: Analytics provider
        type: select
        default: none
        help: Display only — the active provider is set via environment config.
        options:
          none: None
          plausible: Plausible
          ga4: Google Analytics 4
      cookie_message:
        label: Cookie consent message
        type: textarea
        buttons: false
        help: Shown in the consent banner when the provider requires consent.

  notices:
    label: Announcement & maintenance
    icon: alert
    fields:
      announcement_enabled:
        label: Show announcement banner
        type: toggle
        default: false
      announcement_text:
        label: Announcement text
        type: text
        when:
          announcement_enabled: true
      maintenancenheadline:
        type: headline
        label: Maintenance mode
      maintenance_enabled:
        label: Enable maintenance mode
        type: toggle
        default: false
      maintenance_text:
        label: Maintenance message
        type: textarea
        buttons: false
        when:
          maintenance_enabled: true

  files:
    label: Media
    icon: image
    sections:
      images:
        label: Images
        type: files
        template: image
        accept: image/*
        layout: cards
        info: "{{ file.dimensions }}"
