name: Push to FTP site

# GitHub -> server. Mirrors the whole repo to the web docroot on every
# push to the default branch, and can be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Share one lane with the pull workflow so the two directions never run
# at the same time and fight each other.
concurrency:
  group: ftp-sync
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload site over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Web docroot on the server. Override with repo variable
          # FTP_REMOTE_DIR if your host serves from a different path.
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '/public_html' }}
        run: |
          set -euo pipefail
          # mirror -R uploads the whole working tree to the server.
          # Everything except git/CI plumbing goes up; nothing is deleted
          # remotely (safe for any files you keep on the server directly).
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror -R --verbose --parallel=4 \
              --exclude '^\.git' \
              --exclude '^\.github' \
              --exclude 'README' \
              ./ '$REMOTE_DIR';
            bye
          "
