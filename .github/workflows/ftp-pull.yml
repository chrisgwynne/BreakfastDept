name: Pull edits from FTP site

# server -> GitHub. FTP has no webhooks, so this polls on a schedule and
# commits anything that changed on the server back to the repo. Also runnable
# on demand from the Actions tab.
#
# NOTE: The schedule is currently DISABLED. Runs only happen when triggered
# manually from the Actions tab. To re-enable automatic polling, uncomment the
# schedule block below. (lftp timeouts that stop multi-hour hangs land in PR #13.)
on:
  # schedule:
  #   # Every 30 minutes. GitHub may delay scheduled runs under load.
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ftp-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Mirror the web docroot down from the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '/public_html' }}
        run: |
          set -euo pipefail
          # Download the whole docroot into the working tree (no --delete, so
          # nothing in the repo is removed). Git plumbing is left untouched.
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 2;
            set net:idle 300;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror --verbose --parallel=4 \
              --exclude '^\.git' \
              --exclude '^\.github' \
              '$REMOTE_DIR' ./ ;
            bye
          "

      - name: Commit any changes back to the repo
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes on the server."
            exit 0
          fi
          git config user.name  "ftp-sync[bot]"
          git config user.email "ftp-sync@users.noreply.github.com"
          git add -A
          # [skip ci] stops this commit from re-triggering the push-to-FTP
          # workflow, which would just re-upload identical bytes.
          git commit -m "Sync edits from FTP site [skip ci]"
          git push
